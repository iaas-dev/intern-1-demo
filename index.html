<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Editor</title>
</head>

<body>
    <header>
        <h1>Portfolio Editor</h1>
    </header>

    <main>
        <section>
            <h2>Create Your Portfolio</h2>

            <form>
                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name">

                    <label for="job-title">Job Title</label>
                    <input type="text" id="job-title" name="job-title">

                    <label for="bio">About Me</label>
                    <textarea id="bio" name="bio"></textarea>

                    <label for="photo-url">Photo URL</label>
                    <input type="text" id="photo-url" name="photo-url">
                </fieldset>


                <fieldset>
                    <legend>Skills</legend>

                    <label for="skill">Skill</label>
                    <input type="text" id="skill" name="skill">

                    <button type="button">Add Skill</button>

                    <section>
                        <h3>Skills List</h3>

                        <ul>
                            <li>Skills will appear here</li>
                        </ul>
                    </section>
                </fieldset>


                <fieldset>
                    <legend>Projects</legend>

                    <label for="project-name">Project Name</label>
                    <input type="text" id="project-name" name="project-name">

                    <label for="project-description">Project Description</label>
                    <textarea id="project-description" name="project-description"></textarea>

                    <label for="project-link">Project Link</label>
                    <input type="text" id="project-link" name="project-link">

                    <button type="button">Add Project</button>

                    <section>
                        <h3>Project List</h3>

                        <ul>
                            <li>
                                <article>
                                    <h4>Project Name</h4>
                                    <p>Project description will appear here</p>
                                    <a href="#">Project Link</a>
                                </article>
                            </li>
                        </ul>
                    </section>
                </fieldset>

            </form>
        </section>
    </main>
</body>
</html>
